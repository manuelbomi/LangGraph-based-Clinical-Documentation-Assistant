services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-clinical_docs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clinical_docs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # docker-entrypoint.sh runs `alembic upgrade head`, seeds prompts/ICD-10
    # codes/patients/example encounters, then starts uvicorn -- see
    # backend/docker-entrypoint.sh. Milvus Lite is embedded (a local file
    # under /app/data, no separate container needed) -- see README's
    # "Docker / infra" section.
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-clinical_docs}
      SAMPLE_DATA_DIR: /app/sample-data
      UPLOAD_DIR: /app/data/uploads
      MILVUS_LITE_PATH: /app/data/milvus_icd10.db
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-icd10_codes}
      ICD10_TOP_K: ${ICD10_TOP_K:-3}
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:${FRONTEND_PORT:-8080}
    volumes:
      - backend_data:/app/data
      - ./sample-data:/app/sample-data:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
